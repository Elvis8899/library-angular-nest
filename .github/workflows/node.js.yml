# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]
        ## See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: library-test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "yarn"
          cache-dependency-path: ./library-backend/yarn.lock

      - name: run yarn commands
        working-directory: library-backend
        run: |
          yarn && CI=true
          yarn generate
          yarn test:migrate
          # Fails when schema.prisma has changes no migration creates
          yarn migrate:check
          yarn build
          yarn test:cov

      # The tests never run the build output, so check that it starts
      - name: Start the built app
        working-directory: library-backend
        run: |
          npx env-cmd -f .env.test env LOG_LEVEL=info node dist/src/main.js &
          for i in $(seq 1 30); do
            curl -fs localhost:3000/check/status && exit 0
            sleep 1
          done
          exit 1

      - name: Upload coverage summary
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: library-backend/coverage/coverage-summary.json

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: ./library-frontend/.nvmrc
          cache: "yarn"
          cache-dependency-path: ./library-frontend/yarn.lock

      - name: Lint, test and build
        working-directory: library-frontend
        run: |
          yarn install --frozen-lockfile
          yarn lint
          yarn lint:styles
          yarn test --watch=false
          yarn build

      - name: Upload coverage summary
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: library-frontend/coverage/library-frontend/coverage-summary.json

  badges:
    needs: [build, frontend]
    # Pull requests would replace the badges with their own coverage
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Download backend coverage summary
        uses: actions/download-artifact@v7
        with:
          name: backend-coverage
          path: library-backend/coverage

      - name: Download frontend coverage summary
        uses: actions/download-artifact@v7
        with:
          name: frontend-coverage
          path: library-frontend/coverage/library-frontend

      - name: 🔴 Delete remote badges branch
        # The branch does not exist on the first run
        run: git push origin --delete badges || true

      - name: ➕ Create badges branch
        run: git checkout -b badges

      # The part of the path matched by ** names each badge folder:
      # badges/library-backend and badges/library-frontend
      - name: ⚙️ Generating coverage badges
        uses: jpb06/coverage-badges-action@latest
        with:
          branches: "*"
          target-branch: badges
          coverage-summary-path: |
            ./**/coverage/coverage-summary.json
            ./**/coverage/library-frontend/coverage-summary.json

      - name: ⬆️ Push badges branch
        run: git push origin badges
