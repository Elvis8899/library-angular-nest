# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]
        ## See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: library-test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        id: node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      # The workspace's node_modules (the root's, and what's nested in the
      # apps and the contracts) as the lockfile and the exact Node version
      # left them (their native parts are built for that version): the
      # install is skipped while neither changes. Both jobs install the same
      # workspace, so they share it
      - name: Restore node_modules
        id: modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
            packages/contracts/node_modules
          key: modules-${{ runner.os }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('yarn.lock') }}
      - name: Install dependencies
        if: steps.modules.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile
      # Out of Git, and a hit skips the install that builds it
      - name: Build the contracts
        run: yarn contracts:build
      # ESLint keeps its cache in node_modules: a restored copy may hold one,
      # and CI lints without it
      - name: Drop the lint caches
        run: rm -rf backend/node_modules/.cache/eslint frontend/node_modules/.cache/eslint

      # S3-compatible storage for the files (as in the dev compose file).
      # A service container can't be given SeaweedFS's command, so it
      # starts here; the API creates its buckets
      - name: Start the file storage
        run: |
          docker run -d --name storage -p 8333:8333 \
            -e AWS_ACCESS_KEY_ID=storage -e AWS_SECRET_ACCESS_KEY=storage-password \
            chrislusf/seaweedfs:4.48 mini -dir=/data
          for i in $(seq 1 60); do
            # Any answer (403 without credentials) means it's up
            curl -s -o /dev/null localhost:8333 && exit 0
            sleep 1
          done
          docker logs storage
          exit 1

      - name: Contracts
        working-directory: packages/contracts
        run: |
          yarn format:check
          yarn test

      - name: run yarn commands
        working-directory: backend
        run: |
          yarn generate
          yarn test:migrate
          # Fails when prisma/schema has changes no migration creates
          yarn migrate:check
          yarn build
          # SWC strips the types when the tests run, so check them here
          yarn typecheck
          # Without a cache here, so it catches what a stale local one missed
          yarn lint:check
          yarn test:cov

      # The tests never run the build output, so check that it starts
      - name: Start the built app
        working-directory: backend
        run: |
          npx env-cmd -f .env.test env LOG_LEVEL=info node dist/src/main.js &
          for i in $(seq 1 30); do
            curl -fs localhost:3000/check/status && exit 0
            sleep 1
          done
          exit 1

      - name: Upload coverage summary
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage/coverage-summary.json

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js from .nvmrc
        id: node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # As in the backend job. The install's scripts (Prettier, the Git hook)
      # aren't needed here, so skipping them on a hit loses nothing
      - name: Restore node_modules
        id: modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
            packages/contracts/node_modules
          key: modules-${{ runner.os }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('yarn.lock') }}
      - name: Install dependencies
        if: steps.modules.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile
      # Out of Git, and a hit skips the install that builds it
      - name: Build the contracts
        run: yarn contracts:build
      # ESLint keeps its cache in node_modules: a restored copy may hold one,
      # and CI lints without it
      - name: Drop the lint caches
        run: rm -rf backend/node_modules/.cache/eslint frontend/node_modules/.cache/eslint

      # Angular's build cache (on in CI too, angular.json), saved by every run
      # and restored from the latest one with the same dependencies; GitHub
      # drops the least recently used past its 10 GB
      - name: Restore Angular's build cache
        uses: actions/cache@v6
        with:
          path: frontend/.angular/cache
          key: angular-${{ runner.os }}-${{ hashFiles('yarn.lock') }}-${{ github.sha }}
          restore-keys: angular-${{ runner.os }}-${{ hashFiles('yarn.lock') }}-

      - name: Lint, test and build
        working-directory: frontend
        run: |
          yarn lint:check
          yarn lint:styles
          yarn test --watch=false
          yarn build

      - name: Upload coverage summary
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/frontend/coverage-summary.json

  badges:
    needs: [build, frontend]
    # Pull requests would replace the badges with their own coverage
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Download backend coverage summary
        uses: actions/download-artifact@v8
        with:
          name: backend-coverage
          path: backend/coverage

      - name: Download frontend coverage summary
        uses: actions/download-artifact@v8
        with:
          name: frontend-coverage
          path: frontend/coverage/frontend

      - name: 🔴 Delete remote badges branch
        # The branch does not exist on the first run
        run: git push origin --delete badges || true

      - name: ➕ Create badges branch
        run: git checkout -b badges

      # Pinned to a commit: a third-party action runs with this job's push
      # access, and Dependabot updates the hash together with the comment
      - name: ⚙️ Generating coverage badges
        uses: jpb06/coverage-badges-action@6bebba3f008cb03c2be0ff9b148c663df30cde4b # v1.4.11
        with:
          branches: "*"
          target-branch: badges
          # The part of the path matched by ** names each badge folder:
          # badges/backend and badges/frontend
          coverage-summary-path: |
            ./**/coverage/coverage-summary.json
            ./**/coverage/frontend/coverage-summary.json

      - name: ⬆️ Push badges branch
        run: git push origin badges

  # Starts deploying the tested commit and ends once the server has taken it:
  # the server's deploy hook (make serverHook) runs make dockerDeploy in the
  # background, one at a time, queueing a newer commit behind the running
  # one. How it ended is at /hooks/deploy/status and in .docker/deploy.log.
  # Skipped until the repository's DEPLOY_URL variable is set
  deploy:
    needs: [build, frontend]
    if: github.event_name == 'push' && vars.DEPLOY_URL != ''
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: 🚀 Deploy
        env:
          URL: ${{ vars.DEPLOY_URL }}
          TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" "$URL/hooks/deploy?ref=$GITHUB_SHA"
          echo
