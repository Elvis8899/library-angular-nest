# Weekly update pull requests; CI runs on each, so a breaking update shows
# up as a red PR instead of a surprise on the next install
version: 2

updates:
  # The Yarn workspace from its root, so a pull request updates each app's
  # package.json and the one yarn.lock together (from an app's folder,
  # Dependabot misses the lockfile and the frozen install in CI fails)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Released together and must stay on the same version
      nestjs:
        patterns: ["@nestjs/*"]
      prisma:
        patterns: ["prisma", "@prisma/*"]
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "angular-eslint"
          - "@angular-eslint/*"
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Angular and typescript-eslint don't support TypeScript 7 yet
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Follows the Node version in .nvmrc (26)
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  # The images' bases (node, nginx)
  - package-ecosystem: docker
    directories:
      - /backend/.docker
      - /frontend/.docker
    schedule:
      interval: weekly
    ignore:
      # Follows .nvmrc; odd majors are never LTS
      - dependency-name: node
        update-types: [version-update:semver-major]

  # The stacks' services (Postgres, nginx, Grafana, Prometheus…)
  - package-ecosystem: docker-compose
    directory: /.docker
    schedule:
      interval: weekly
    ignore:
      # A new major can't read the old one's data without pg_upgrade
      - dependency-name: postgres
        update-types: [version-update:semver-major]
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
