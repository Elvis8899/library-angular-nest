<div [class.menu-open]="menuOpen()" class="shell layout-wrapper">
  <aside class="side-nav" id="side-nav">
    <app-sidebar />
  </aside>
  <!-- Only shown on small screens, behind the open menu -->
  @if (menuOpen()) {
    <div (click)="closeMenu()" aria-hidden="true" class="scrim"></div>
  }
  <main>
    <header class="main-header">
      <app-header (menuToggle)="toggleMenu()" [menuOpen]="menuOpen()" />
    </header>
    <div class="content">
      <router-outlet />
    </div>
  </main>
</div>
