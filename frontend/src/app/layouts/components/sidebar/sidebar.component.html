<nav class="sidebar" [class.collapsed]="!expanded()">
  <button
    (click)="toggle()"
    [attr.aria-expanded]="expanded()"
    [attr.aria-label]="'nav.toggleMenu' | translate"
    class="toggle"
    type="button"
  >
    <mat-icon>chevron_left</mat-icon>
  </button>

  <a class="brand" routerLink="/">
    <span aria-hidden="true" class="brand-logo">
      <mat-icon>local_library</mat-icon>
    </span>
    <span class="brand-name">{{ "app.name" | translate }}</span>
  </a>

  <mat-nav-list class="menu">
    @for (row of rows; track $index) {
      @if (row.kind === "group") {
        @let open = isOpen(row.group);
        <!-- A closed group holding the current page is marked as current -->
        <button
          (click)="toggleGroup(row.group)"
          [attr.aria-expanded]="open"
          [attr.title]="expanded() ? null : (row.group.title | translate)"
          [class.active]="!open && currentGroup() === row.group"
          [class.open]="open"
          class="menu-link menu-group"
          mat-list-item
          type="button"
        >
          <mat-icon matListItemIcon>{{ row.group.icon }}</mat-icon>
          <span class="menu-label" matListItemTitle>{{
            row.group.title | translate
          }}</span>
        </button>
        @if (open) {
          <div class="menu-group-items">
            @for (item of row.items; track item.route) {
              <ng-container
                *ngTemplateOutlet="link; context: { $implicit: item }"
              />
            }
          </div>
        }
      } @else {
        <ng-container
          *ngTemplateOutlet="link; context: { $implicit: row.item }"
        />
      }
    }
  </mat-nav-list>

  <!-- Logout, kept at the bottom below a divider -->
  <mat-nav-list class="menu menu-end">
    <ng-container
      *ngTemplateOutlet="link; context: { $implicit: logoutItem }"
    />
  </mat-nav-list>
</nav>

<ng-template #link let-item>
  <a
    #active="routerLinkActive"
    [activated]="active.isActive"
    [attr.title]="expanded() ? null : (item.title | translate)"
    [routerLink]="item.route"
    class="menu-link"
    mat-list-item
    routerLinkActive="active"
  >
    <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
    <span class="menu-label" matListItemTitle>{{
      item.title | translate
    }}</span>
  </a>
</ng-template>
