<form (ngSubmit)="onSubmit()" [formGroup]="addBookForm">
  <app-form-card subtitle="books.form.subtitle" title="books.create">
    <div class="cover-row">
      <div class="cover-picker">
        <img [src]="coverPreview() ?? noCoverImage" alt="" class="cover" />
        <input
          #coverInput
          (change)="pickCover($event)"
          [accept]="coverTypes"
          class="visually-hidden"
          name="cover"
          tabindex="-1"
          type="file"
        />
        <button
          (click)="coverInput.click()"
          matButton
          name="pickCover"
          type="button"
        >
          <mat-icon>image</mat-icon>
          {{
            (cover() ? "books.cover.change" : "books.form.pickCover")
              | translate
          }}
        </button>
        @if (cover()) {
          <button
            (click)="clearCover()"
            matButton
            name="clearCover"
            type="button"
          >
            {{ "books.cover.remove" | translate }}
          </button>
        }
      </div>
      <div class="cover-fields">
        <mat-form-field appearance="outline" hideRequiredMarker>
          <mat-label>{{ "common.name" | translate }}</mat-label>
          <input formControlName="name" matInput name="name" />
          <mat-error>{{ "validation.name.required" | translate }}</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" hideRequiredMarker>
          <mat-label>{{ "books.price" | translate }}</mat-label>
          <span matTextPrefix>R$&nbsp;</span>
          <input
            formControlName="price"
            matInput
            min="0"
            name="price"
            step="0.01"
            type="number"
          />
          <mat-error>{{ "books.form.priceInvalid" | translate }}</mat-error>
        </mat-form-field>
        <p class="small-note">{{ "books.form.coverHint" | translate }}</p>
      </div>
    </div>

    <a formActions matButton name="cancel" routerLink="/books/list">
      {{ "common.cancel" | translate }}
    </a>
    <button
      [appBusy]="saving()"
      [disabled]="saving()"
      formActions
      matButton="filled"
      name="save"
      type="submit"
    >
      {{ "common.save" | translate }}
    </button>
  </app-form-card>
</form>
