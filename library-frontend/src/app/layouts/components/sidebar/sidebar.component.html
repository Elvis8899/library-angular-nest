<nav class="sidebar" [class.collapsed]="!expanded()">
  <button
    (click)="toggle()"
    [attr.aria-expanded]="expanded()"
    [attr.aria-label]="'Toggle menu' | translate"
    class="toggle"
    type="button"
  >
    <mat-icon>chevron_left</mat-icon>
  </button>

  <a class="brand" routerLink="/">
    <span aria-hidden="true" class="brand-logo">
      <mat-icon>local_library</mat-icon>
    </span>
    <span class="brand-name">{{ "Library" | translate }}</span>
  </a>

  <ul class="menu">
    @for (item of items; track item.route) {
      <li>
        <ng-container *ngTemplateOutlet="link; context: { $implicit: item }" />
      </li>
    }
  </ul>

  <ul class="menu menu-end">
    <li>
      <ng-container
        *ngTemplateOutlet="link; context: { $implicit: logoutItem }"
      />
    </li>
  </ul>
</nav>

<ng-template #link let-item>
  <a
    [routerLink]="item.route"
    [attr.title]="expanded() ? null : (item.title | translate)"
    class="menu-link"
    routerLinkActive="active"
  >
    <mat-icon class="menu-icon">{{ item.icon }}</mat-icon>
    <span class="menu-label">{{ item.title | translate }}</span>
  </a>
</ng-template>
