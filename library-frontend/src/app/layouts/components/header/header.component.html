<nav>
  <!-- Small screens only: the sidebar is a menu there -->
  <button
    (click)="menuToggle.emit()"
    [attr.aria-expanded]="menuOpen()"
    [attr.aria-label]="
      (menuOpen() ? 'nav.closeMenu' : 'nav.openMenu') | translate
    "
    aria-controls="side-nav"
    class="menu-button"
    mat-icon-button
    name="toggleMenu"
    type="button"
  >
    <mat-icon>{{ menuOpen() ? "close" : "menu" }}</mat-icon>
  </button>
  <div class="user">
    <span aria-hidden="true" class="avatar">{{ initials() }}</span>
    <span class="user-text">
      <span class="user-name">{{ userName() }}</span>
      <span class="user-role">{{
        (isAdmin() ? "roles.admin" : "roles.client") | translate
      }}</span>
    </span>
  </div>
  <div class="actions">
    <app-theme-toggle />
    <app-language-selector />
  </div>
</nav>
