<div class="table-wrapper">
  <!-- Always takes its height, so showing it doesn't move the table -->
  <mat-progress-bar
    [class.hidden]="!loading()"
    class="loading"
    mode="indeterminate"
  />

  <ng-content></ng-content>
  <table mat-table [dataSource]="data()" class="table">
    <tr mat-header-row *matHeaderRowDef="shownColumns(); sticky: true"></tr>
    <tr mat-row *matRowDef="let row; columns: shownColumns()"></tr>
    <tr *matNoDataRow class="no-data-row">
      <td [attr.colspan]="shownColumns().length" class="no-data">
        @if (!loading()) {
          {{ "common.noResults" | translate }}
        }
      </td>
    </tr>
  </table>
  @if (page(); as page) {
    <mat-paginator
      [length]="page.count"
      [pageSize]="page.limit"
      [pageIndex]="page.page"
      [pageSizeOptions]="data().pageSizeOptions"
      (page)="handlePageEvent($event)"
    >
    </mat-paginator>
  }
</div>
