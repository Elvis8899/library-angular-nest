<mat-card appearance="outlined" class="form-card">
  <mat-card-header>
    <mat-card-title>
      <h1 class="title">{{ title() | translate }}</h1>
    </mat-card-title>
    @if (subtitle(); as subtitle) {
      <mat-card-subtitle>{{ subtitle | translate }}</mat-card-subtitle>
    }
  </mat-card-header>
  <mat-card-content class="fields">
    <ng-content />
  </mat-card-content>
  <mat-card-actions align="end" class="actions">
    <ng-content select="[formActions]" />
  </mat-card-actions>
</mat-card>
