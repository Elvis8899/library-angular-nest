<button
  [attr.aria-label]="
    ('Language' | translate) + ': ' + languageName(currentLanguage())
  "
  [matMenuTriggerFor]="languageMenu"
  matButton
  name="language"
  type="button"
>
  <mat-icon>translate</mat-icon>
  {{ shortName(currentLanguage()) }}
</button>
<mat-menu #languageMenu xPosition="before">
  @for (language of languages(); track language) {
    <button
      (click)="setLanguage(language)"
      [attr.aria-current]="language === currentLanguage() ? 'true' : null"
      [attr.lang]="language"
      [class.current]="language === currentLanguage()"
      mat-menu-item
      name="languageOption"
    >
      <mat-icon>{{ language === currentLanguage() ? "check" : "" }}</mat-icon>
      {{ languageName(language) }}
    </button>
  }
</mat-menu>
