name: "library-dev"

services:
  nginx:
    image: nginx:latest
    # restart: always
    ports:
      - "3000:80"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/nginx.conf
    depends_on:
      - app
      - frontend
      - postgres
    environment:
      UPLOAD_FILE_SIZE_LIMIT: 20

  # Angular dev server, served by nginx at /. The browser calls /v1 on the
  # same origin, so nginx sends those to the API and proxy.conf.json is unused
  # Both containers mount the whole workspace and install it on start; the
  # mutex makes the second wait for the first
  frontend:
    image: node:24-slim
    working_dir: /usr/src/app/frontend
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      YARN_CACHE_FOLDER: /usr/src/app/.yarn-cache
      NG_CLI_ANALYTICS: "false"
      # No Git in the image to install the hook with
      HUSKY: "0"
    volumes:
      - ..:/usr/src/app
    command: sh -c "yarn install --frozen-lockfile --mutex file:/usr/src/app/.yarn-mutex && yarn ng serve --host 0.0.0.0 --port 4200"

  app:
    build:
      context: ..
      dockerfile: backend/.docker/Dockerfile.dev
    env_file: ../backend/.env.dev
    # Run as the host user so files written to the mounted source folder
    # (node_modules, dist, migrations) are not owned by root. The default
    # matches the image's node user; set HOST_UID/HOST_GID if yours differ.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      YARN_CACHE_FOLDER: /usr/src/app/.yarn-cache
      HUSKY: "0"
    # Uncomment this line in case you are in M1
    # platform: linux/amd64
    volumes:
      - ..:/usr/src/app
    # ports:
    #   - "3000:3000"
    depends_on:
      - postgres

  postgres:
    image: postgres:latest
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: "user"
      POSTGRES_PASSWORD: "password"
      POSTGRES_DB: "library"
    volumes:
      - library-postgres:/var/lib/postgresql/library-data

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@email.com
      PGADMIN_DEFAULT_PASSWORD: admin
      SCRIPT_NAME: "/pgadmin4"
      PGADMIN_DISABLE_POSTFIX: "true"
      #- PGADMIN_ENABLE_TLS=false
      PGADMIN_LISTEN_ADDRESS: "0.0.0.0"
      PGADMIN_LISTEN_PORT: "80"
    # ports:
    #   - 5050:80
    volumes:
      - ./servers.dev.json:/pgadmin4/servers.json

  prometheus:
    image: prom/prometheus:latest
    # ports:
    #   - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      # - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      # - '--storage.tsdb.path=/prometheus'
      # - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      # - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.external-url=http://localhost:3000/prometheus/'
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    # ports:
    #   - "${GRAFANA_PORT:-3001}:3000"
    # volumes:
    #   - grafana_data:/var/lib/grafana
    environment:
      - GF_SERVER_ROOT_URL=http://localhost:3000/grafana/
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus


volumes:
  library-postgres:
