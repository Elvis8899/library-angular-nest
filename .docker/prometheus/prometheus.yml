# The dev stack's (docker-compose-dev.yml); production's is
# prometheus.prod.yml, with the same jobs
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Under --web.external-url's /prometheus/ path
  - job_name: prometheus
    metrics_path: /prometheus/metrics
    static_configs:
      - targets: ["localhost:9090"]

  # The API's metrics server (METRICS_PORT), on the Docker network only
  - job_name: api
    static_configs:
      - targets: ["app:9464"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # SeaweedFS (-metricsPort)
  - job_name: storage
    static_configs:
      - targets: ["storage:9327"]

  # The site as a user reaches it, probed by the blackbox exporter
  - job_name: site
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://nginx/check/status"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # The Docker daemon's own metrics; up only when its daemon.json sets
  # "metrics-addr": "0.0.0.0:9323"
  - job_name: docker
    static_configs:
      - targets: ["host.docker.internal:9323"]
