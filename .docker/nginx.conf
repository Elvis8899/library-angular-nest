user  nginx;
worker_processes  auto;


events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    client_max_body_size 20M;

    # Compresses the app's files and the API's JSON. gzip_proxied: also for
    # clients behind a proxy (a Via header, as some mobile networks add);
    # gzip_vary keeps those proxies from caching one version for every client
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;

    # Plain HTTP: Let's Encrypt's challenges for certificate renewals, and a
    # redirect to HTTPS for everything else
    server {
      listen 80;
      server_name _;

      location /.well-known/acme-challenge/ {
          root /var/www/certbot;
      }
      location / {
          return 301 https://$host$request_uri;
      }
      access_log off;
    }

    server {
      listen 443 ssl;
      http2 on;
      server_name _;
      client_max_body_size 20M;

      # Issued by `make dockerCertificate` and renewed by the certbot service
      # (--cert-name site, so the path doesn't depend on the domain)
      ssl_certificate     /etc/letsencrypt/live/site/fullchain.pem;
      ssl_certificate_key /etc/letsencrypt/live/site/privkey.pem;

      add_header Strict-Transport-Security "max-age=31536000" always;

      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Host $http_host;
      proxy_set_header X-NginX-Proxy true;
      proxy_redirect off;

      location /v1/ {
          proxy_pass http://172.18.0.1:3000;
          # Real client IP for the API's rate limiting (see TRUST_PROXY);
          # overwritten rather than appended so clients cannot spoof it
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $remote_addr;
      }
      location /check/ {
          proxy_pass http://172.18.0.1:3000;
      }
      location /swagger/ {
          proxy_pass http://172.18.0.1:3000;
      }
      # The deploy hook CI calls, a service on the server itself
      # (.docker/deployHook.py, make serverHook); it checks its own token
      location /hooks/ {
          proxy_pass http://172.18.0.1:9010;
      }
      location /pgadmin4/ {
          proxy_pass http://172.18.0.1:5050;
      }

      # The Angular app (built into the image). Unknown paths get index.html,
      # so the client-side router handles them
      root /usr/share/nginx/html;
      location / {
          try_files $uri $uri/ /index.html;
      }
      # Must be revalidated, or browsers keep running an old version
      location = /index.html {
          expires -1;
      }
      location ~ ^/(ngsw-worker\.js|ngsw\.json|safety-worker\.js|worker-basic\.min\.js)$ {
          expires -1;
      }
      # Build output with a content hash in the name never changes
      location ~ "^/(chunk|main|polyfills|styles)-[A-Za-z0-9_-]{8}\.(js|css)$" {
          expires 1y;
      }

      location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
      }
      access_log off;
      error_log /var/log/nginx/error.log error;
    }
}
