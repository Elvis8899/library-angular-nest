name: "library"

services:
  # Serves the frontend build and proxies the API, over HTTPS
  nginx:
    build:
      context: ..
      dockerfile: frontend/.docker/Dockerfile
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    # Reloads every 6 hours to pick up renewed certificates
    command: /bin/sh -c 'while :; do sleep 6h; nginx -s reload; done & exec nginx -g "daemon off;"'
    depends_on:
      - app
      - postgres
      - certbot
    networks:
      - nginx_network
    environment:
      UPLOAD_FILE_SIZE_LIMIT: 20

  # Renews the certificate twice a day when it's close to expiring. The first
  # one is issued by `make dockerCertificate`
  certbot:
    image: certbot/certbot:latest
    restart: always
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .docker/.env}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:?Set CERTBOT_EMAIL in .docker/.env}
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'

  app:
    build:
      context: ..
      dockerfile: backend/.docker/Dockerfile
    restart: always
    # The API's settings, from the repo root's .env. The root .dockerignore
    # leaves every .env out of the build context, so they can't end up in the
    # image
    env_file: ../.env
    # Uncomment this line in case you are in M1
    # platform: linux/amd64
    # Reachable only through nginx, which proxies to the nginx_network
    # gateway (172.18.0.1); publishing on all interfaces would bypass it
    ports:
      - "172.18.0.1:3000:3000"
    environment:
      # Requests come from nginx through the gateway: trust its
      # X-Forwarded-For so login rate limiting sees the client IP
      TRUST_PROXY: "172.18.0.0/16"
      # Overrides the one in ../.env, so the credentials live only in .docker/.env
      DATABASE_URL: &databaseUrl postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .docker/.env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .docker/.env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .docker/.env}
    networks:
      - "nginx_network"
    depends_on:
      - postgres

  postgres:
    image: postgres:latest
    restart: always
    # Not reachable from outside the server: the app uses the Docker
    # network, and admins can connect from the server or an SSH tunnel
    ports:
      - "172.18.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - library-postgres:/var/lib/postgresql/data
    networks:
      - "nginx_network"

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?Set PGADMIN_EMAIL in .docker/.env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Set PGADMIN_PASSWORD in .docker/.env}
      SCRIPT_NAME: "/pgadmin4"
    # Reachable only through nginx (/pgadmin4/), like the API
    ports:
      - "172.18.0.1:5050:80"
    networks:
      - "nginx_network"

  migrate-deploy:
    build:
      context: ..
      dockerfile: backend/.docker/Dockerfile
      target: migrate
    # Uncomment this line in case you are in M1
    # platform: linux/amd64
    env_file: ../.env
    environment:
      DATABASE_URL: *databaseUrl
    ports:
      - "3001:3001"
    networks:
      - "nginx_network"
    depends_on:
      - postgres

networks:
  nginx_network:
    external: true

volumes:
  library-postgres:
  letsencrypt:
  certbot-webroot:
