name: "library"

services:
  nginx:
    image: nginx:latest
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app
      - postgres
    networks:
      - nginx_network
    environment:
      UPLOAD_FILE_SIZE_LIMIT: 20

  app:
    build:
      context: ../backend
      dockerfile: .docker/Dockerfile
    restart: always
    # Uncomment this line in case you are in M1
    # platform: linux/amd64
    # Reachable only through nginx, which proxies to the nginx_network
    # gateway (172.18.0.1); publishing on all interfaces would bypass it
    ports:
      - "172.18.0.1:3000:3000"
    environment:
      # Requests come from nginx through the gateway: trust its
      # X-Forwarded-For so login rate limiting sees the client IP
      TRUST_PROXY: "172.18.0.0/16"
    networks:
      - "nginx_network"
    depends_on:
      - postgres

  postgres:
    image: postgres:latest
    restart: always
    # Not reachable from outside the server: the app uses the Docker
    # network, and admins can connect from the server or an SSH tunnel
    ports:
      - "172.18.0.1:5432:5432"
    environment:
      POSTGRES_USER: "user"
      POSTGRES_PASSWORD: "password"
      POSTGRES_DB: "library"
    volumes:
      - library-postgres:/var/lib/postgresql/data
    networks:
      - "nginx_network"

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@email.com
      PGADMIN_DEFAULT_PASSWORD: admin
      SCRIPT_NAME: "/pgadmin4"
    # Reachable only through nginx (/pgadmin4/), like the API
    ports:
      - "172.18.0.1:5050:80"
    networks:
      - "nginx_network"

  migrate-deploy:
    build:
      context: ../backend
      dockerfile: .docker/Dockerfile
      target: migrate
    # Uncomment this line in case you are in M1
    # platform: linux/amd64
    ports:
      - "3001:3001"
    networks:
      - "nginx_network"
    depends_on:
      - postgres

networks:
  nginx_network:
    external: true

volumes:
  library-postgres:
